[project]
name = "homebot"
version = "0.1.0"
description = "Ivy, a home server assistant on Telegram and Discord, driven by any OpenAI-compatible model"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
    "openai>=3.36.1",
    "psutil>=7.2.2",
    "python-telegram-bot>=22.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
